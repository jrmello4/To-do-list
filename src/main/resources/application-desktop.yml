server:
  address: 127.0.0.1
  port: 8791
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    # Banco persistente no diretório do usuário (~/.lifehub). Nada de memória volátil.
    url: jdbc:h2:file:~/.lifehub/lifehub;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  upload:
    dir: ${user.home}/.lifehub/uploads/
  cors:
    allowed-origins: http://127.0.0.1:8791,http://localhost:8791
  desktop:
    auto-login: true
  esportes:
    enabled: true
    api-base-url: ${SPORTS_API_BASE_URL:https://www.thesportsdb.com/api/v1/json}
    api-key: ${SPORTS_API_KEY:123}

jwt:
  # Segredo local do modo desktop (servidor escuta apenas 127.0.0.1). Pode ser sobrescrito por JWT_SECRET.
  secret: ${JWT_SECRET:lifehub-desktop-local-only-secret-key-please-change-32b}
  expiration: 2592000000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

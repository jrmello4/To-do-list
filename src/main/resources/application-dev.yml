spring:
  datasource:
    url: jdbc:h2:mem:todolist;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Chave apenas para desenvolvimento local — nunca use em produção
  secret: dev-only-not-for-production-404E635266556A586E3272357538782F413F4428472B4B62

app:
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
  esportes:
    # Em dev pode-se desligar a chamada externa com enabled=false
    enabled: true

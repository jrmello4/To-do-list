server:
  # PORT vem primeiro porque é o nome que os serviços de hospedagem injetam;
  # sem ele a aplicação sobe numa porta que ninguém está escutando.
  port: ${PORT:${SERVER_PORT:8080}}

  # Faz getRemoteAddr() enxergar o IP de quem chamou, e não o do proxy.
  #
  # Importa para o limite de tentativas de login, que conta por origem: atrás
  # de um proxy sem isto, toda a internet chega com o mesmo endereço e vinte
  # tentativas erradas de uma pessoa trancam todas as outras. O contrário —
  # ligado sem proxy na frente — deixa o cabeçalho ser forjado e o limite
  # deixa de valer. Como o projeto é feito para rodar hospedado, e trancar
  # quem é inocente é pior do que voltar ao que havia antes do limite, o
  # padrão atende o caso do proxy; sem proxy, defina como none.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  datasource:
    # Valores padrão servem para desenvolvimento local. Em qualquer outro
    # ambiente, defina as variáveis — ver .env.example.
    url: ${DB_URL:jdbc:mysql://localhost:3306/todolist?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # Sem driver-class-name: o Spring o deduz da URL. Fixá-lo aqui vazaria para
    # o perfil de teste (que é aditivo) e forçaria o driver do MySQL sobre o H2.

  jpa:
    # Desligado de propósito: mantém a sessão JPA restrita à camada de serviço,
    # em vez de deixá-la aberta durante a renderização da resposta.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Desligado aqui e ligado no perfil dev, logo abaixo. Ligado para todo
    # ambiente, cada requisição gastava CPU formatando SQL e enchia o log de
    # produção a ponto de esconder o que importa — inclusive o log de erro que
    # existe justamente para não perder rastro de falha nenhuma.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    # spring.mail.host fica de fora de propósito. EnviadorPorEmail só existe
    # quando essa propriedade está definida, e um ${MAIL_HOST:} vazio aqui
    # conta como definida: ligaria o envio real sem servidor nenhum atrás.
    # Para ligar de verdade, defina SPRING_MAIL_HOST no ambiente.
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: list

management:
  endpoints:
    web:
      exposure:
        # Só o health. Expor tudo publicaria variáveis de ambiente e métricas
        # internas junto, sem ninguém ter pedido.
        include: health
  endpoint:
    health:
      show-details: never

---
# Perfil de desenvolvimento: rode com SPRING_PROFILES_ACTIVE=dev para ver as
# consultas que o Hibernate emite.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
